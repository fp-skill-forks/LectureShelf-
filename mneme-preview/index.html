<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mneme Preview">
<meta name="theme-color" content="#f6f1ea">
<title>Mneme Preview</title>
<link rel="stylesheet" href="./mneme-v2.css?v=2">
</head>
<body>
<div class="app">
<header class="masthead"><div><div id="today" class="kicker"></div><h1>Mneme</h1></div><button class="round addTop" aria-label="Save something" onclick="Mneme.openSave()">+</button></header>
<main id="view"></main></div>
<button class="fab" aria-label="Save something" onclick="Mneme.openSave()">+</button>
<nav class="tabbar" aria-label="Main navigation"><button data-tab="home" onclick="Mneme.setTab('home')"><span>⌂</span>Home</button><button data-tab="library" onclick="Mneme.setTab('library')"><span>▤</span>Library</button><button data-tab="collections" onclick="Mneme.setTab('collections')"><span>◫</span>Collections</button><button data-tab="settings" onclick="Mneme.setTab('settings')"><span>⚙︎</span>Settings</button></nav>
<div id="saveBackdrop" class="backdrop" onclick="if(event.target===this)Mneme.closeSave()"><section class="sheet"><div class="handle"></div><div class="sheetHead"><h2>Save to Mneme</h2><button class="quiet" onclick="Mneme.closeSave()">Done</button></div><label>Link<input id="saveUrl" inputmode="url" placeholder="Paste a link"></label><div id="savePreview" class="preview"><div class="previewIcon">＋</div><div><b>Paste or share a link</b><small>Preview will appear here</small></div></div><label>Title<input id="saveTitle" placeholder="Optional title"></label><label>Collection<div class="collectionRow"><select id="saveCollection"></select><button class="newCollection" onclick="Mneme.newCollectionFromSave()">+ New</button></div></label><label>Note<textarea id="saveNote" placeholder="Why did you save this?"></textarea></label><button class="primary" onclick="Mneme.saveItem()">Save</button></section></div>
<div id="editBackdrop" class="backdrop" onclick="if(event.target===this)Mneme.closeEdit()"><section class="sheet"><div class="handle"></div><div class="sheetHead"><h2>Edit details</h2><button class="quiet" onclick="Mneme.closeEdit()">Done</button></div><label>Title<input id="editTitle"></label><label>Collection<select id="editCollection"></select></label><label>Note<textarea id="editNote"></textarea></label><button class="primary" onclick="Mneme.saveEdit()">Save changes</button><button class="delete" onclick="Mneme.deleteEditing()">Remove item</button></section></div>
<script src="./mneme-v2.js?v=1"></script><script src="./mneme-v2-fixes.js?v=5"></script>
</body></html>
