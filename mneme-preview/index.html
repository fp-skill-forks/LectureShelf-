<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mneme Preview">
<meta name="theme-color" content="#f6f1ea">
<title>Mneme Preview</title>
<link rel="stylesheet" href="./mneme-v2.css?v=16">
<style>
.fab{display:none!important}#topAdd[hidden]{display:none!important}.labelHint{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:10px;color:var(--muted);margin-top:7px}.labelPicker{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}.labelChoice{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:650}.labelChoice.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper));color:var(--accent)}.labelAdd{border-style:dashed;color:var(--accent)}.labelTag{background:color-mix(in srgb,var(--accent) 10%,transparent)!important;border-color:color-mix(in srgb,var(--accent) 28%,var(--line))!important;color:var(--accent)}.notesList{display:flex;flex-direction:column;gap:8px;margin:12px 0}.noteRow{background:var(--soft);border-radius:12px;padding:10px 11px}.noteTop{display:flex;align-items:center;gap:8px;margin-bottom:4px}.noteTime{border:0;background:var(--paper);color:var(--accent);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.noteText{font-size:12px;line-height:1.35}.noteMeta{font-size:9px;color:var(--muted);margin-left:auto}.noteDelete{border:0;background:transparent;color:var(--danger);font-size:11px}.noteComposer{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:start}.noteComposer input,.noteComposer textarea{margin-top:0}.noteComposer textarea{min-height:58px}.notesEmpty{font-size:11px;color:var(--muted);padding:10px 2px}.notesGeneral{margin-bottom:14px}.mediaSheet{max-height:92vh}.videoWrap{aspect-ratio:16/9;background:#000;border-radius:15px;overflow:hidden}.videoWrap iframe{width:100%;height:100%;border:0}.mediaMeta{padding:12px 2px 2px}.mediaMeta h2{font:600 24px/1.08 "Newsreader",Georgia,serif;margin:0 0 5px}.readerView{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}.readerView.show{display:flex}.readerTop{padding:calc(10px + env(safe-area-inset-top)) 12px 9px;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.readerTop button{border:0;background:var(--soft);color:var(--ink);border-radius:11px;padding:8px 10px;font-size:12px;font-weight:700}.readerTop strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 18px/1 "Newsreader",Georgia,serif}.readerProgress{height:3px;background:var(--line)}.readerProgress span{display:block;height:100%;background:var(--accent);width:0}.readerScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.article{max-width:700px;margin:auto;padding:28px 22px 90px;font:400 19px/1.7 "Newsreader",Georgia,serif}.article h1,.article h2,.article h3{line-height:1.15}.article h1{font-size:34px}.article h2{font-size:26px;margin-top:32px}.article h3{font-size:22px;margin-top:26px}.article a{color:var(--accent)}.article blockquote{border-left:3px solid var(--accent);padding-left:15px;color:var(--muted);margin:22px 0}.readerNote{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;line-height:1.45;background:var(--soft);border-radius:13px;padding:12px;margin-bottom:24px;color:var(--muted)}.readerLoading{text-align:center;color:var(--muted);padding:70px 10px}
</style>
</head>
<body>
<div class="app"><header class="masthead"><div><div id="today" class="kicker"></div><h1>Mneme</h1></div><button id="topAdd" class="round addTop" aria-label="Save something" onclick="Mneme.openSave()">+</button></header><main id="view"></main></div>
<nav class="tabbar" aria-label="Main navigation"><button data-tab="home" onclick="Mneme.setTab('home')"><span>⌂</span>Home</button><button data-tab="library" onclick="Mneme.setTab('library')"><span>▤</span>Library</button><button data-tab="collections" onclick="Mneme.setTab('collections')"><span>◫</span>Collections</button><button data-tab="settings" onclick="Mneme.setTab('settings')"><span>⚙︎</span>Settings</button></nav>
<div id="saveBackdrop" class="backdrop" onclick="if(event.target===this)Mneme.closeSave()"><section class="sheet"><div class="handle"></div><div class="sheetHead"><h2>Save to Mneme</h2><button class="quiet" onclick="Mneme.closeSave()">Done</button></div><label>Link<input id="saveUrl" inputmode="url" placeholder="Paste a link"></label><div id="savePreview" class="preview"><div class="previewIcon">＋</div><div><b>Paste or share a link</b><small>Preview will appear here</small></div></div><label>Title<input id="saveTitle" placeholder="Optional title"></label><label>Category<div class="collectionRow"><select id="saveCollection"></select><button class="newCollection" onclick="Mneme.newCollectionFromSave()">+ New</button></div></label><label>Additional Labels<input id="saveLabels" type="hidden"><div id="saveLabelPicker" class="labelPicker"></div><span class="labelHint">Choose any that apply, or create a new label.</span></label><label>Note<textarea id="saveNote" placeholder="Why did you save this?"></textarea></label><button class="primary" onclick="Mneme.saveItem()">Save</button></section></div>
<div id="editBackdrop" class="backdrop" onclick="if(event.target===this)Mneme.closeEdit()"><section class="sheet"><div class="handle"></div><div class="sheetHead"><h2>Edit details</h2><button class="quiet" onclick="Mneme.closeEdit()">Done</button></div><label>Title<input id="editTitle"></label><label>Category<select id="editCollection"></select></label><label>Additional Labels<input id="editLabels" type="hidden"><div id="editLabelPicker" class="labelPicker"></div><span class="labelHint">Choose any that apply, or create a new label.</span></label><label>Note<textarea id="editNote"></textarea></label><button class="primary" onclick="Mneme.saveEdit()">Save changes</button><button class="delete" onclick="Mneme.deleteEditing()">Remove item</button></section></div>
<div id="notesBackdrop" class="backdrop" onclick="if(event.target===this)MnemeNotes.close()"><section class="sheet"><div class="handle"></div><div class="sheetHead"><h2 id="notesTitle">Notes</h2><button class="quiet" onclick="MnemeNotes.close()">Done</button></div><label class="notesGeneral">General note<textarea id="generalNote" placeholder="What matters about this?"></textarea></label><button class="primary" onclick="MnemeNotes.saveGeneral()">Save general note</button><div id="timestampSection"><div class="sectionHead" style="margin-top:18px"><h2>Timestamped notes</h2></div><div id="notesList" class="notesList"></div><label>Add note<div class="noteComposer"><input id="noteTime" placeholder="12:43" inputmode="numeric"><textarea id="noteText" placeholder="What happens here?"></textarea></div></label><button class="primary" onclick="MnemeNotes.addTimestamp()">Add timestamped note</button></div></section></div>
<div id="playerBackdrop" class="backdrop" onclick="if(event.target===this)MnemeMedia.closePlayer()"><section class="sheet mediaSheet"><div class="handle"></div><div class="videoWrap"><div id="ytPlayer"></div></div><div class="mediaMeta"><h2 id="mediaPlayerTitle">YouTube video</h2><div id="mediaPlayerStatus" class="meta"></div><div class="actions"><button class="soft" onclick="MnemeMedia.closePlayer()">Close</button></div></div></section></div>
<div id="readerBackdrop" class="readerView"><div class="readerTop"><button onclick="MnemeMedia.closeReader()">‹ Back</button><strong id="readerTitle">Reader</strong><button onclick="MnemeMedia.openExternalReader()">External</button></div><div class="readerProgress"><span id="readerBar"></span></div><div id="readerScroll" class="readerScroll"><article id="article" class="article"></article></div></div>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="./mneme-v2.js?v=16"></script><script src="./labels.js?v=3"></script><script src="./media.js?v=2"></script><script src="./notes.js?v=2"></script>
<script>(()=>{const KEY='lectureshelf-mini-v1';const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{items:[]}}};const fallback=window.Mneme.openItem.bind(window.Mneme);window.Mneme.openItem=function(uid){const d=read(),x=(d.items||[]).find(i=>i.uid===uid);if(!x)return;if(x.type==='youtube'&&window.MnemeMedia){window.MnemeMedia.openVideo(x);return}if(x.type==='link'&&window.MnemeMedia){window.MnemeMedia.openReader(x);return}fallback(uid)};const sync=()=>{const b=document.getElementById('topAdd');if(b)b.hidden=!!document.querySelector('[data-tab="settings"].active')};new MutationObserver(sync).observe(document.querySelector('.tabbar'),{subtree:true,attributes:true,attributeFilter:['class']});sync()})();</script>
</body></html>
