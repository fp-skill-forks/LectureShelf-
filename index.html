<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LectureShelf"><title>LectureShelf</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;padding:16px}h1{font-size:25px}.card{background:#1d1d1f;border-radius:16px;padding:14px;margin-bottom:14px}input,button{font:inherit;border-radius:12px;border:0;padding:12px}input{width:100%;background:#2a2a2d;color:#fff;margin-bottom:10px}button{background:#fff;color:#111;font-weight:700}.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1}.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.small{color:#aaa;font-size:13px}.item{padding:12px 0;border-top:1px solid #333}</style></head><body><h1>LectureShelf</h1><div class="card"><input id="url" placeholder="Paste YouTube link"><input id="title" placeholder="Optional title"><button onclick="addVideo()">Save & Open</button></div><div id="playerCard" class="card" style="display:none"><div class="player"><div id="player"></div></div><p id="nowTitle"></p><p id="status" class="small"></p><div class="row"><button onclick="savePos()">Save position</button><button onclick="markDone()">Complete</button></div></div><div class="card"><strong>Saved videos</strong><div id="list" class="small">None yet.</div></div><script src="https://www.youtube.com/iframe_api"></script><script>const KEY='lectureshelf-mini-v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"videos":[]}'),player=null,ready=false,current=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function idFrom(s){try{const u=new URL(s.trim());if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]}}catch(e){}return /^[\w-]{11}$/.test(s.trim())?s.trim():null}function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(){const l=$('list');if(!data.videos.length){l.textContent='None yet.';return}l.innerHTML='';[...data.videos].reverse().forEach(v=>{const d=document.createElement('div');d.className='item';d.innerHTML='<b>'+esc(v.title||'YouTube video')+'</b><br>'+(v.done?'Completed':v.pos?'Resume at '+fmt(v.pos):'Not started')+'<div class="row"><button>Open</button><button>Remove</button></div>';const b=d.querySelectorAll('button');b[0].onclick=()=>openVideo(v.id);b[1].onclick=()=>removeVideo(v.id);l.appendChild(d)})}function addVideo(){const id=idFrom($('url').value);if(!id){alert('Please paste a valid YouTube link.');return}let v=data.videos.find(x=>x.id===id);if(!v){v={id,title:$('title').value.trim(),pos:0,done:false,updated:Date.now()};data.videos.push(v)}save();render();openVideo(id)}function openVideo(id){savePos();current=id;const v=data.videos.find(x=>x.id===id);$('playerCard').style.display='block';$('nowTitle').textContent=v.title||'YouTube video';$('status').textContent=v.done?'Completed':'Saved at '+fmt(v.pos);if(ready)player.loadVideoById({videoId:v.id,startSeconds:v.pos||0})}function savePos(){if(!ready||!current||!player)return;const v=data.videos.find(x=>x.id===current);if(!v)return;const t=player.getCurrentTime();if(Number.isFinite(t)){v.pos=t;v.updated=Date.now();save();render();$('status').textContent=(v.done?'Completed • ':'Saved at ')+fmt(v.pos)}}function markDone(){if(!current)return;savePos();const v=data.videos.find(x=>x.id===current);v.done=!v.done;save();render()}function removeVideo(id){if(current===id){current=null;$('playerCard').style.display='none';if(ready)player.stopVideo()}data.videos=data.videos.filter(x=>x.id!==id);save();render()}window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:'',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;const last=[...data.videos].sort((a,b)=>(b.updated||0)-(a.updated||0))[0];if(last)openVideo(last.id)},onStateChange:e=>{if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)savePos()}}})};setInterval(savePos,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});window.addEventListener('pagehide',savePos);render();</script></body></html>
