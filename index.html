r(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}.nav{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav button{background:transparent;color:var(--muted);font-size:11px;padding:7px 4px;border-radius:12px}.nav button.active{color:var(--accent);background:var(--surface2)}.nav b{display:block;font-size:20px;margin-bottom:2px}.fab{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:25;width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;box-shadow:0 12px 28px rgba(10,132,255,.35)}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;display:none}.backdrop.show{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:14px 16px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:42px;height:5px;background:var(--line);border-radius:10px;margin:0 auto 14px}.sheet h3{font-size:22px;margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 4px}.field input,.field textarea,.field select{width:100%;border:0;border-radius:14px;background:var(--surface2);color:var(--text);padding:13px;font:inherit}.field textarea{min-height:90px}.primary{width:100%;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:800}.secondary{padding:10px 12px;border-radius:12px;background:var(--surface2);color:var(--text);font-weight:700}.danger{padding:10px 12px;border-radius:12px;background:transparent;color:var(--danger);font-weight:700}.playerCard{background:var(--surface);border-radius:22px;padding:12px}.player{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.player iframe{width:100%;height:100%;border:0}.settingsCard{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}.settingsCard select{width:100%;padding:12px;border:0;border-radius:12px;background:var(--surface2);color:var(--text)}.empty{text-align:center;color:var(--muted);padding:36px 12px}.reader{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}.reader.show{display:flex}.readerTop{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.readerTop button{border:0;border-radius:12px;background:var(--surface2);color:var(--text);padding:9px 11px;font:inherit;font-weight:700}.readerTitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.readerScroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;scroll-behavior:auto}.article{max-width:720px;margin:auto;padding:28px 22px 80px;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.7}.article h1,.article h2,.article h3{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;line-height:1.15}.article h1{font-size:32px}.article h2{font-size:25px;margin-top:32px}.article h3{font-size:21px;margin-top:26px}.article p{margin:0 0 1.2em}.article a{color:var(--accent)}.article blockquote{border-left:4px solid var(--line);margin:20px 0;padding-left:16px;color:var(--muted)}.readerProgress{height:3px;background:var(--line)}.readerProgress span{display:block;height:100%;background:var(--accent);width:0}.loading{text-align:center;color:var(--muted);padding:80px 20px}.noteBox{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:24px;color:var(--muted)}@media(max-width:390px){.item{grid-template-columns:102px 1fr}.visual{width:102px}.mini{flex-basis:170px}.article{font-size:18px;padding-left:18px;padding-right:18px}}</style></head><body><div class="shell"><div class="topbar"><div class="brand">LectureShelf</div><button class="iconbtn" onclick="openAdd()">＋</button></div><main id="view"></main></div><button class="fab" onclick="openAdd()">＋</button><div class="bottom"><div class="nav"><button id="nav-home" onclick="setTab('home')"><b>⌂</b>Home</button><button id="nav-library" onclick="setTab('library')"><b>▤</b>Library</button><button id="nav-collections" onclick="setTab('collections')"><b>◫</b>Collections</button><button id="nav-settings" onclick="setTab('settings')"><b>⚙︎</b>Settings</button></div></div><div id="addSheet" class="backdrop" onclick="if(event.target===this)closeAdd()"><div class="sheet"><div class="handle"></div><h3>Save something</h3><div class="field"><label>Link</label><input id="addUrl" placeholder="YouTube, X, article, anything…" inputmode="url"></div><div class="field"><label>Title</label><input id="addTitle" placeholder="Optional title"></div><div class="field"><label>Collection</label><select id="addCollection"></select></div><div class="field"><label>Note</label><textarea id="addNote" placeholder="Why did you save this?"></textarea></div><button class="primary" onclick="saveNewItem()">Save</button></div></div><div id="editSheet" class="backdrop" onclick="if(event.target===this)closeEdit()"><div class="sheet"><div class="handle"></div><h3>Edit item</h3><div class="field"><label>Title</label><input id="editTitle"></div><div class="field"><label>Collection</label><select id="editCollection"></select></div><div class="field"><label>Note</label><textarea id="editNote"></textarea></div><button class="primary" onclick="saveEdit()">Save changes</button><div style="height:8px"></div><button class="danger" style="width:100%" onclick="deleteEditing()">Remove item</button></div></div><div id="reader" class="reader"><div class="readerTop"><button onclick="closeReader()">‹ Back</button><div id="readerTitle" class="readerTitle">Reader</div><button onclick="openOriginal()">Original</button></div><div class="readerProgress"><span id="readerBar"></span></div><div id="readerScroll" class="readerScroll"><div id="article" class="article"><div class="loading">Loading article…</div></div></div></div><script src="https://www.youtube.com/iframe_api"></script><script>const KEY='lectureshelf-mini-v1',THEME_KEY='lectureshelf-theme';let raw={};try{raw=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let data={items:[],collections:[]};if(Array.isArray(raw.items)){data=raw}else{data.collections=Array.isArray(raw.groups)?raw.groups:[];data.items=(Array.isArray(raw.videos)?raw.videos:[]).map(v=>({uid:'yt-'+v.id,type:'youtube',url:'https://www.youtube.com/watch?v='+v.id,youtubeId:v.id,title:v.title||'',collection:v.group||'Ungrouped',note:v.note||'',pos:v.pos||0,duration:v.duration||0,done:!!v.done,created:v.addedAt||v.updated||Date.now(),updated:v.updated||Date.now()}))}data.items.forEach(x=>{if(!x.uid)x.uid=(x.type||'link')+'-'+Math.random().toString(36).slice(2);if(!x.collection)x.collection='Ungrouped';if(!x.created)x.created=x.updated||Date.now();if(!x.updated)x.updated=x.created;if(!Number.isFinite(x.readPct))x.readPct=0});let tab='home',activeCollection='All',editingUid=null,player=null,ready=false,currentUid=null,readerUid=null,readerTimer=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}save();let currentTheme=localStorage.getItem(THEME_KEY)||'system';if(currentTheme!=='system')document.documentElement.dataset.theme=currentTheme;function allCollections(){return ['Ungrouped',...data.collections.filter(x=>x&&x!=='Ungrouped')]}function detectType(url){try{const h=new URL(url).hostname.replace(/^www\./,'');if(h==='youtu.be'||h.endsWith('youtube.com'))return'youtube';if(h==='x.com'||h==='twitter.com')return'x';return'link'}catch{return'link'}}function ytId(url){try{const u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]||''}}catch{}return''}function host(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch{return'Link'}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function thumb(x){return x.type==='youtube'&&x.youtubeId?'https://i.ytimg.com/vi/'+encodeURIComponent(x.youtubeId)+'/hqdefault.jpg':''}function pct(x){if(x.done)return 100;if(x.type==='link')return Math.round(x.readPct||0);if(x.duration>0)return Math.min(99,Math.max(0,Math.round((x.pos||0)/x.duration*100)));return 0}function status(x){if(x.type==='link'){if(x.done)return'Completed';return x.readPct>1?'Resume reading · '+Math.round(x.readPct)+'%':host(x.url)}if(x.type==='x')return x.done?'Completed':'X post';if(x.done)return'Completed';if(x.pos&&x.duration)return pct(x)+'% · '+fmt(x.pos)+' / '+fmt(x.duration);if(x.pos)return'Resume at '+fmt(x.pos);return'Not started'}function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+sec:m+':'+sec}function visual(x){const t=thumb(x);if(t)return'<div class="visual"><img src="'+t+'"><div class="progress"><span style="width:'+pct(x)+'%"></span></div></div>';const label=x.type==='x'?'X':host(x.url).slice(0,1).toUpperCase();return'<div class="visual"><div class="siteBadge">'+esc(label)+'</div>'+(x.type==='link'&&x.readPct?'<div class="progress"><span style="width:'+pct(x)+'%"></span></div>':'')+'</div>'}function defaultTitle(x){return x.type==='youtube'?'YouTube video':x.type==='x'?'X post':host(x.url)}function card(x){return'<div class="item">'+visual(x)+'<div><h4>'+esc(x.title||defaultTitle(x))+'</h4><div class="meta">'+esc(status(x))+'</div><div class="tags"><span class="tag">'+esc(x.collection)+'</span><span class="tag">'+(x.type==='youtube'?'Video':x.type==='x'?'X post':'Article')+'</span></div><div class="itemActions"><button class="openBtn" onclick="openItem(\''+x.uid+'\')">'+(x.type==='youtube'?'Open':x.type==='link'?'Read':'Visit')+'</button><button class="softBtn" onclick="editItem(\''+x.uid+'\')">Edit</button></div></div></div>'}function setTab(t){tab=t;render()}function nav(){['home','library','collections','settings'].forEach(t=>{const n=$('nav-'+t);if(n)n.classList.toggle('active',t===tab)})}function render(){nav();if(tab==='home')renderHome();else if(tab==='library')renderLibrary();else if(tab==='collections')renderCollections();else renderSettings()}function renderHome(){const cont=data.items.filter(x=>!x.done&&((x.type==='youtube'&&x.pos>0)||(x.type==='link'&&x.readPct>1))).sort((a,b)=>b.updated-a.updated).slice(0,8);const recent=[...data.items].sort((a,b)=>b.created-a.created).slice(0,8);$('view').innerHTML='<div class="hero"><h2>Your learning inbox</h2><p>Save videos, X posts, articles and anything worth coming back to.</p></div>'+(cont.length?'<div class="section"><div class="sectionHead"><h3>Continue</h3></div><div class="strip">'+cont.map(mini).join('')+'</div></div>':'')+'<div class="section"><div class="sectionHead"><h3>Recently saved</h3><span class="muted">'+data.items.length+' items</span></div><div class="list">'+(recent.length?recent.map(card).join(''):'<div class="empty">Nothing saved yet.</div>')+'</div></div>'}function mini(x){const t=thumb(x);return'<div class="mini" onclick="openItem(\''+x.uid+'\')">'+(t?'<img src="'+t+'">':'<div class="visual" style="width:100%;aspect-ratio:16/9">'+esc(x.type==='x'?'X':host(x.url).slice(0,1).toUpperCase())+'</div>')+'<div class="t">'+esc(x.title||defaultTitle(x))+'</div><div class="s">'+esc(status(x))+'</div></div>'}function renderLibrary(){const items=[...data.items].sort((a,b)=>b.updated-a.updated).filter(x=>activeCollection==='All'||x.collection===activeCollection);$('view').innerHTML='<div class="section"><div class="sectionHead"><h3>Library</h3><span class="muted">'+items.length+'</span></div><div class="chips">'+['All',...allCollections()].map(c=>'<button class="pill '+(c===activeCollection?'active':'')+'" onclick="activeCollection=\''+esc(c)+'\';renderLibrary()">'+esc(c)+'</button>').join('')+'</div></div><div class="list">'+(items.length?items.map(card).join(''):'<div class="empty">No items here.</div>')+'</div>'}function renderCollections(){const cols=allCollections();$('view').innerHTML='<div class="section"><div class="sectionHead"><h3>Collections</h3></div><div class="settingsCard"><div class="field"><label>New collection</label><input id="newCollection" placeholder="e.g. Economics, Ideas, Travel"></div><button class="primary" onclick="addCollection()">Create collection</button></div><div class="list">'+cols.map(c=>'<div class="settingsCard" onclick="activeCollection=\''+esc(c)+'\';tab=\'library\';render()"><div class="sectionHead"><strong>'+esc(c)+'</strong><span class="muted">'+data.items.filter(x=>x.collection===c).length+' items</span></div></div>').join('')+'</div></div>'}function renderSettings(){$('view').innerHTML='<div class="section"><div class="sectionHead"><h3>Settings</h3></div><div class="settingsCard"><div class="field"><label>Appearance</label><select id="themeSetting"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div><div class="settingsCard"><strong>Backup</strong><p class="muted">Export or restore your whole library.</p><div style="display:flex;gap:8px"><button class="secondary" onclick="exportData()">Export</button><button class="secondary" onclick="importData()">Import</button></div></div></div>';$('themeSetting').value=currentTheme;$('themeSetting').onchange=e=>{currentTheme=e.target.value;if(currentTheme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=currentTheme;localStorage.setItem(THEME_KEY,currentTheme)}}function openAdd(){fillCollectionSelect($('addCollection'));$('addSheet').classList.add('show');setTimeout(()=>$('addUrl').focus(),100)}function closeAdd(){$('addSheet').classList.remove('show')}function fillCollectionSelect(sel,selected='Ungrouped'){sel.innerHTML=allCollections().map(c=>'<option value="'+esc(c)+'" '+(c===selected?'selected':'')+'>'+esc(c)+'</option>').join('')}function saveNewItem(){const url=$('addUrl').value.trim();if(!url){alert('Paste a link first.');return}let normalized=url;try{normalized=new URL(url).href}catch{try{normalized=new URL('https://'+url).href}catch{alert('That link does not look valid.');return}}const type=detectType(normalized),id=type==='youtube'?ytId(normalized):'',uid=(type==='youtube'&&id)?'yt-'+id:'i-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);let x=data.items.find(i=>i.uid===uid);if(x){x.updated=Date.now();x.collection=$('addCollection').value;if($('addTitle').value.trim())x.title=$('addTitle').value.trim();if($('addNote').value.trim())x.note=$('addNote').value.trim()}else data.items.push({uid,type,url:normalized,youtubeId:id,title:$('addTitle').value.trim(),collection:$('addCollection').value||'Ungrouped',note:$('addNote').value.trim(),pos:0,duration:0,readPct:0,done:false,created:Date.now(),updated:Date.now()});save();$('addUrl').value='';$('addTitle').value='';$('addNote').value='';closeAdd();render();if(type==='youtube'&&id)openItem(uid)}function openItem(uid){savePlayer();const x=data.items.find(i=>i.uid===uid);if(!x)return;x.updated=Date.now();save();if(x.type==='youtube'&&x.youtubeId){currentUid=uid;showPlayer(x)}else if(x.type==='link'){openReader(uid)}else window.open(x.url,'_blank','noopener')}function showPlayer(x){let box=$('playerHost');if(!box){box=document.createElement('div');box.id='playerHost';box.className='backdrop show';box.onclick=e=>{if(e.target===box)closePlayer()};box.innerHTML='<div class="sheet"><div class="handle"></div><div class="playerCard"><div class="player"><div id="player"></div></div><h3 id="playerTitle" style="margin:12px 2px 4px"></h3><div id="playerStatus" class="muted"></div><div style="display:flex;gap:8px;margin-top:10px"><button class="secondary" onclick="toggleDoneCurrent()">Complete</button><button class="secondary" onclick="closePlayer()">Close</button></div></div></div>';document.body.appendChild(box);ready=false;player=new YT.Player('player',{videoId:x.youtubeId,playerVars:{playsinline:1,rel:0,start:Math.floor(x.pos||0)},events:{onReady:()=>{ready=true;player.seekTo(x.pos||0,true);syncPlayerMeta()},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING)setTimeout(syncPlayerMeta,350);if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)savePlayer()}}})}else{box.classList.add('show');if(ready&&player)player.loadVideoById({videoId:x.youtubeId,startSeconds:x.pos||0})}$('playerTitle').textContent=x.title||'YouTube video';$('playerStatus').textContent=status(x)}function closePlayer(){savePlayer();const box=$('playerHost');if(box)box.classList.remove('show');currentUid=null}function syncPlayerMeta(){if(!ready||!player||!currentUid)return;const x=data.items.find(i=>i.uid===currentUid);if(!x)return;const vd=player.getVideoData?player.getVideoData():null,d=player.getDuration?player.getDuration():0;if(vd&&vd.title&&!x.title)x.title=vd.title.trim();if(Number.isFinite(d)&&d>0)x.duration=d;save();if($('playerTitle'))$('playerTitle').textContent=x.title||'YouTube video';if($('playerStatus'))$('playerStatus').textContent=status(x)}function savePlayer(){if(!ready||!player||!currentUid)return;const x=data.items.find(i=>i.uid===currentUid);if(!x)return;const t=player.getCurrentTime?player.getCurrentTime():0,d=player.getDuration?player.getDuration():0;if(Number.isFinite(t)){x.pos=t;x.updated=Date.now()}if(Number.isFinite(d)&&d>0)x.duration=d;if(x.duration&&x.pos>=x.duration-5)x.done=true;save()}function toggleDoneCurrent(){const x=data.items.find(i=>i.uid===currentUid);if(!x)return;x.done=!x.done;save();if($('playerStatus'))$('playerStatus').textContent=status(x);render()}async function openReader(uid){const x=data.items.find(i=>i.uid===uid);if(!x)return;readerUid=uid;$('readerTitle').textContent=x.title||host(x.url);$('article').innerHTML='<div class="loading">Preparing Reader Mode…</div>';$('reader').classList.add('show');$('readerBar').style.width=(x.readPct||0)+'%';try{const res=await fetch('https://r.jina.ai/'+x.url);if(!res.ok)throw new Error('reader');const txt=await res.text();if(!txt.trim())throw new Error('empty');const parsed=parseReader(txt);if(!x.title&&parsed.title){x.title=parsed.title;$('readerTitle').textContent=parsed.title}x.readerCached=txt;x.updated=Date.now();save();$('article').innerHTML=(x.note?'<div class="noteBox">'+esc(x.note)+'</div>':'')+renderMarkdown(parsed.body);requestAnimationFrame(()=>restoreReaderPosition(x))}catch(e){$('article').innerHTML='<div class="loading"><p>Reader Mode could not load this article.</p><button class="secondary" onclick="openOriginal()">Open original page</button></div>'}}function parseReader(txt){let title='';const lines=txt.replace(/\r/g,'').split('\n');for(const l of lines.slice(0,12)){const m=l.match(/^Title:\s*(.+)$/i);if(m){title=m[1].trim();break}}let body=txt.replace(/^Title:.*$/mi,'').replace(/^URL Source:.*$/mi,'').replace(/^Published Time:.*$/mi,'').replace(/^Markdown Content:\s*/mi,'').trim();return{title,body}}function inlineMd(s){let out=esc(s);out=out.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');out=out.replace(/\*([^*]+)\*/g,'<em>$1</em>');return out}function renderMarkdown(md){const lines=md.split('\n'),html=[];let para=[];function flush(){if(para.length){html.push('<p>'+inlineMd(para.join(' '))+'</p>');para=[]}}for(let line of lines){line=line.trim();if(!line){flush();continue}let m;if((m=line.match(/^###\s+(.+)/))){flush();html.push('<h3>'+inlineMd(m[1])+'</h3>')}else if((m=line.match(/^##\s+(.+)/))){flush();html.push('<h2>'+inlineMd(m[1])+'</h2>')}else if((m=line.match(/^#\s+(.+)/))){flush();html.push('<h1>'+inlineMd(m[1])+'</h1>')}else if((m=line.match(/^>\s*(.+)/))){flush();html.push('<blockquote>'+inlineMd(m[1])+'</blockquote>')}else if(/^[-*]\s+/.test(line)){flush();html.push('<p>• '+inlineMd(line.replace(/^[-*]\s+/,''))+'</p>')}else para.push(line)}flush();return html.join('')}function restoreReaderPosition(x){const s=$('readerScroll'),max=Math.max(0,s.scrollHeight-s.clientHeight);s.scrollTop=max*(Math.max(0,Math.min(100,x.readPct||0))/100)}function saveReaderPosition(){if(!readerUid)return;const x=data.items.find(i=>i.uid===readerUid),s=$('readerScroll');if(!x||!s)return;const max=Math.max(1,s.scrollHeight-s.clientHeight);x.readPct=Math.max(0,Math.min(100,(s.scrollTop/max)*100));x.updated=Date.now();if(x.readPct>97)x.done=true;$('readerBar').style.width=x.readPct+'%';save()}$('readerScroll').addEventListener('scroll',()=>{clearTimeout(readerTimer);readerTimer=setTimeout(saveReaderPosition,120)});function closeReader(){saveReaderPosition();$('reader').classList.remove('show');readerUid=null;render()}function openOriginal(){const x=data.items.find(i=>i.uid===readerUid);if(x)window.open(x.url,'_blank','noopener')}function editItem(uid){editingUid=uid;const x=data.items.find(i=>i.uid===uid);if(!x)return;$('editTitle').value=x.title||'';$('editNote').value=x.note||'';fillCollectionSelect($('editCollection'),x.collection);$('editSheet').classList.add('show')}function closeEdit(){$('editSheet').classList.remove('show');editingUid=null}function saveEdit(){const x=data.items.find(i=>i.uid===editingUid);if(!x)return;x.title=$('editTitle').value.trim();x.note=$('editNote').value.trim();x.collection=$('editCollection').value;x.updated=Date.now();save();closeEdit();render()}function deleteEditing(){if(!editingUid||!confirm('Remove this item?'))return;data.items=data.items.filter(i=>i.uid!==editingUid);save();closeEdit();render()}function addCollection(){const inp=$('newCollection'),n=inp.value.trim();if(!n||n==='Ungrouped'||data.collections.includ
