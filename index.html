<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="LectureShelf"><title>LectureShelf</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f5f7;--text:#111;--card:#fff;--input:#eeeef0;--muted:#666;--border:#d7d7dc;--button:#111;--buttonText:#fff}html[data-theme="dark"]{color-scheme:dark;--bg:#111;--text:#fff;--card:#1d1d1f;--input:#2a2a2d;--muted:#aaa;--border:#333;--button:#fff;--buttonText:#111}html[data-theme="light"]{color-scheme:light;--bg:#f5f5f7;--text:#111;--card:#fff;--input:#eeeef0;--muted:#666;--border:#d7d7dc;--button:#111;--buttonText:#fff}@media(prefers-color-scheme:dark){html:not([data-theme]){--bg:#111;--text:#fff;--card:#1d1d1f;--input:#2a2a2d;--muted:#aaa;--border:#333;--button:#fff;--buttonText:#111}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:16px;transition:background .2s,color .2s}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}h1{font-size:25px;margin:0}.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}input,button,select{font:inherit;border-radius:12px;border:0;padding:12px}input,select{width:100%;background:var(--input);color:var(--text);margin-bottom:10px}select{width:auto;margin:0}button{background:var(--button);color:var(--buttonText);font-weight:700}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row button{flex:1;min-width:90px}.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.small{color:var(--muted);font-size:13px}.item{padding:12px 0;border-top:1px solid var(--border)}.item:first-child{border-top:0}.title{font-weight:700;color:var(--text);margin-bottom:4px}.groupbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:10px 0}.groupbar button{flex:0 0 auto;padding:8px 12px}.groupbar button.active{outline:2px solid var(--text)}.inline{display:flex;gap:8px}.inline input{margin:0;flex:1}.inline button{flex:0 0 auto}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.meta select{max-width:52%;padding:8px}.mutebtn{background:var(--input);color:var(--text)}</style></head><body><div class="top"><h1>LectureShelf</h1><select id="theme" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="card"><input id="url" placeholder="Paste YouTube link"><input id="title" placeholder="Optional custom title"><select id="addGroup"></select><button onclick="addVideo()">Save & Open</button></div><div class="card"><strong>Groups</strong><div class="inline" style="margin-top:10px"><input id="newGroup" placeholder="New group name"><button onclick="createGroup()">Add</button></div><div id="groupbar" class="groupbar"></div></div><div id="playerCard" class="card" style="display:none"><div class="player"><div id="player"></div></div><p id="nowTitle"></p><p id="status" class="small"></p><div class="row"><button onclick="savePos()">Save position</button><button onclick="markDone()">Complete</button></div></div><div class="card"><strong>Saved videos</strong><div id="list" class="small">None yet.</div></div><script src="https://www.youtube.com/iframe_api"></script><script>const KEY='lectureshelf-mini-v1',THEME_KEY='lectureshelf-theme';let data=JSON.parse(localStorage.getItem(KEY)||'{"videos":[]}'),player=null,ready=false,current=null,activeGroup='All';if(!Array.isArray(data.groups))data.groups=[];data.videos.forEach(v=>{if(typeof v.group!=='string')v.group='Ungrouped'});const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function applyTheme(value){if(value==='system'){document.documentElement.removeAttribute('data-theme')}else{document.documentElement.setAttribute('data-theme',value)}localStorage.setItem(THEME_KEY,value)}const initialTheme=localStorage.getItem(THEME_KEY)||'system';$('theme').value=initialTheme;applyTheme(initialTheme);$('theme').addEventListener('change',e=>applyTheme(e.target.value));function idFrom(s){try{const u=new URL(s.trim());if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]}}catch(e){}return /^[\w-]{11}$/.test(s.trim())?s.trim():null}function fmt(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function allGroups(){return ['Ungrouped',...data.groups.filter(g=>g&&g!=='Ungrouped')]}function renderGroups(){const opts=allGroups();$('addGroup').innerHTML=opts.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');const bar=$('groupbar');bar.innerHTML='';['All',...opts].forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=(g===activeGroup?'active ':'')+'mutebtn';b.onclick=()=>{activeGroup=g;renderGroups();render()};bar.appendChild(b)})}function createGroup(){const name=$('newGroup').value.trim();if(!name||name==='All'||name==='Ungrouped')return;if(!data.groups.includes(name))data.groups.push(name);$('newGroup').value='';save();renderGroups();render()}function renameVideo(id){const v=data.videos.find(x=>x.id===id);if(!v)return;const name=prompt('Rename video',v.title||'');if(name===null)return;const trimmed=name.trim();if(trimmed){v.title=trimmed;save();render();if(current===id)$('nowTitle').textContent=trimmed}}function moveVideo(id,group){const v=data.videos.find(x=>x.id===id);if(!v)return;v.group=group;save();render()}function render(){const l=$('list');const videos=[...data.videos].reverse().filter(v=>activeGroup==='All'||v.group===activeGroup);if(!videos.length){l.textContent=activeGroup==='All'?'None yet.':'No videos in this group.';return}l.innerHTML='';videos.forEach(v=>{const d=document.createElement('div');d.className='item';const groupOptions=allGroups().map(g=>'<option value="'+esc(g)+'" '+(g===v.group?'selected':'')+'>'+esc(g)+'</option>').join('');d.innerHTML='<div class="title">'+esc(v.title||'Loading title…')+'</div><div class="meta"><span>'+(v.done?'Completed':v.pos?'Resume at '+fmt(v.pos):'Not started')+'</span><select class="groupSelect">'+groupOptions+'</select></div><div class="row"><button class="open">Open</button><button class="rename mutebtn">Rename</button><button class="remove mutebtn">Remove</button></div>';d.querySelector('.open').onclick=()=>openVideo(v.id);d.querySelector('.rename').onclick=()=>renameVideo(v.id);d.querySelector('.remove').onclick=()=>removeVideo(v.id);d.querySelector('.groupSelect').onchange=e=>moveVideo(v.id,e.target.value);l.appendChild(d)})}function addVideo(){const id=idFrom($('url').value);if(!id){alert('Please paste a valid YouTube link.');return}let v=data.videos.find(x=>x.id===id);const custom=$('title').value.trim(),group=$('addGroup').value||'Ungrouped';if(!v){v={id,title:custom,pos:0,done:false,updated:Date.now(),group};data.videos.push(v)}else{if(custom)v.title=custom;v.group=group}save();renderGroups();render();openVideo(id);$('url').value='';$('title').value=''}function updateCurrentTitleFromPlayer(){if(!ready||!current||!player||!player.getVideoData)return;const info=player.getVideoData();const title=info&&info.title?info.title.trim():'';if(!title)return;const v=data.videos.find(x=>x.id===current);if(!v)return;if(!v.title||v.title==='YouTube video'||v.title==='Loading title…'){v.title=title;save();render()}$('nowTitle').textContent=v.title||title}function openVideo(id){savePos();current=id;const v=data.videos.find(x=>x.id===id);$('playerCard').style.display='block';$('nowTitle').textContent=v.title||'Loading title…';$('status').textContent=v.done?'Completed':'Saved at '+fmt(v.pos);if(ready)player.loadVideoById({videoId:v.id,startSeconds:v.pos||0})}function savePos(){if(!ready||!current||!player)return;const v=data.videos.find(x=>x.id===current);if(!v)return;const t=player.getCurrentTime();if(Number.isFinite(t)){v.pos=t;v.updated=Date.now();save();render();$('status').textContent=(v.done?'Completed • ':'Saved at ')+fmt(v.pos)}}function markDone(){if(!current)return;savePos();const v=data.videos.find(x=>x.id===current);v.done=!v.done;save();render();$('status').textContent=v.done?'Completed':'Saved at '+fmt(v.pos)}function removeVideo(id){if(current===id){current=null;$('playerCard').style.display='none';if(ready)player.stopVideo()}data.videos=data.videos.filter(x=>x.id!==id);save();render()}window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:'',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;const last=[...data.videos].sort((a,b)=>(b.updated||0)-(a.updated||0))[0];if(last)openVideo(last.id)},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING||e.data===YT.PlayerState.CUED){setTimeout(updateCurrentTitleFromPlayer,300)}if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)savePos()}}})};setInterval(()=>{savePos();updateCurrentTitleFromPlayer()},5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});window.addEventListener('pagehide',savePos);renderGroups();render();</script></body></html>
