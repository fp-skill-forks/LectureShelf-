<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="LectureShelf"><meta name="theme-color" content="#111111"><link rel="manifest" href="manifest.webmanifest"><title>LectureShelf</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#f5f5f7;--text:#111;--card:#fff;--input:#eeeef0;--muted:#666;--border:#d7d7dc;--button:#111;--buttonText:#fff}html[data-theme="dark"]{color-scheme:dark;--bg:#111;--text:#fff;--card:#1d1d1f;--input:#2a2a2d;--muted:#aaa;--border:#333;--button:#fff;--buttonText:#111}html[data-theme="light"]{color-scheme:light;--bg:#f5f5f7;--text:#111;--card:#fff;--input:#eeeef0;--muted:#666;--border:#d7d7dc;--button:#111;--buttonText:#fff}@media(prefers-color-scheme:dark){html:not([data-theme]){--bg:#111;--text:#fff;--card:#1d1d1f;--input:#2a2a2d;--muted:#aaa;--border:#333;--button:#fff;--buttonText:#111}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));transition:background .2s,color .2s}.top,.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:16px}h1{font-size:25px;margin:0}.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}input,button,select{font:inherit;border-radius:12px;border:0;padding:12px}input,select{width:100%;background:var(--input);color:var(--text);margin-bottom:10px}select{width:auto;margin:0}button{background:var(--button);color:var(--buttonText);font-weight:700}.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.row button{flex:1;min-width:78px}.player{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}iframe{width:100%;height:100%;border:0}.small,.count{color:var(--muted);font-size:13px}.groupbar{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:10px 0}.groupbar button{flex:0 0 auto;padding:8px 12px}.groupbar button.active{outline:2px solid var(--text)}.inline{display:flex;gap:8px}.inline input{margin:0;flex:1}.inline button{flex:0 0 auto}.mutebtn{background:var(--input);color:var(--text)}.videoCard{display:grid;grid-template-columns:128px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--border)}.videoCard:first-child{border-top:0}.thumbWrap{position:relative;align-self:start}.thumb{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;display:block}.progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.4);overflow:hidden;border-radius:0 0 10px 10px}.progress span{display:block;height:100%;background:#ff0033}.videoInfo{min-width:0}.title{font-weight:700;color:var(--text);line-height:1.25;margin:1px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.status{color:var(--muted);font-size:12px;margin-bottom:7px}.videoInfo select{max-width:100%;padding:7px 9px;font-size:12px;margin:0}.actions{display:flex;gap:6px;margin-top:7px}.actions button{padding:8px;font-size:12px;flex:1}.continueStrip{display:flex;gap:10px;overflow-x:auto;padding:10px 0 2px}.continueItem{flex:0 0 160px}.continueItem img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block}.continueItem .title{font-size:13px;margin-top:6px}.continueItem .status{margin:0}.backup{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.backup button{width:100%}#importFile{display:none}@media(max-width:380px){.videoCard{grid-template-columns:112px 1fr}.thumb{width:112px}.actions{flex-wrap:wrap}.actions button{min-width:55px}}</style></head><body><div class="top"><h1>LectureShelf</h1><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="card"><input id="url" placeholder="Paste YouTube link"><input id="title" placeholder="Optional custom title"><select id="addGroup"></select><button onclick="addVideo()">Save & Open</button></div><div id="continueCard" class="card" style="display:none"><div class="sectionTitle"><strong>Continue Watching</strong><span class="small">Recent</span></div><div id="continueStrip" class="continueStrip"></div></div><div class="card"><strong>Groups</strong><div class="inline" style="margin-top:10px"><input id="newGroup" placeholder="New group name"><button onclick="createGroup()">Add</button></div><div id="groupbar" class="groupbar"></div></div><div id="playerCard" class="card" style="display:none"><div class="player"><div id="player"></div></div><p id="nowTitle"></p><p id="status" class="small"></p><div class="row"><button onclick="savePos()">Save position</button><button onclick="markDone()">Complete</button></div></div><div class="card"><div class="sectionTitle"><strong>Saved videos</strong><span id="count" class="count"></span></div><div id="list"></div></div><div class="card"><strong>Backup & transfer</strong><p class="small">Export your groups, titles and watch positions to a file. Import it later on this or another device.</p><div class="backup"><button onclick="exportLibrary()">Export Library</button><button class="mutebtn" onclick="$('importFile').click()">Import Library</button></div><input id="importFile" type="file" accept="application/json,.json"></div><script src="https://www.youtube.com/iframe_api"></script><script>const KEY='lectureshelf-mini-v1',THEME_KEY='lectureshelf-theme';let data=JSON.parse(localStorage.getItem(KEY)||'{"videos":[]}'),player=null,ready=false,current=null,activeGroup='All';if(!Array.isArray(data.groups))data.groups=[];if(!Array.isArray(data.videos))data.videos=[];data.videos.forEach(v=>{if(typeof v.group!=='string')v.group='Ungrouped';if(!Number.isFinite(v.duration))v.duration=0});const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function applyTheme(v){if(v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',v);localStorage.setItem(THEME_KEY,v)}const initialTheme=localStorage.getItem(THEME_KEY)||'system';$('theme').value=initialTheme;applyTheme(initialTheme);$('theme').onchange=e=>applyTheme(e.target.value);function idFrom(s){try{const u=new URL(s.trim());if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');const p=u.pathname.split('/').filter(Boolean);if(['shorts','embed','live'].includes(p[0]))return p[1]}}catch(e){}return /^[\w-]{11}$/.test(s.trim())?s.trim():null}function fmt(s){s=Math.max(0,Math.floor(s||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=String(s%60).padStart(2,'0');return h?h+':'+String(m).padStart(2,'0')+':'+sec:m+':'+sec}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pct(v){if(v.done)return 100;if(v.duration>0)return Math.max(0,Math.min(99,Math.round((v.pos||0)/v.duration*100)));return 0}function status(v){const p=pct(v);if(v.done)return 'Completed';if(v.pos&&v.duration)return p+'% · '+fmt(v.pos)+' / '+fmt(v.duration);if(v.pos)return 'Resume at '+fmt(v.pos);return 'Not started'}function allGroups(){return ['Ungrouped',...data.groups.filter(g=>g&&g!=='Ungrouped')]}function renderGroups(){const opts=allGroups();$('addGroup').innerHTML=opts.map(g=>'<option value="'+esc(g)+'">'+esc(g)+'</option>').join('');const bar=$('groupbar');bar.innerHTML='';['All',...opts].forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=(g===activeGroup?'active ':'')+'mutebtn';b.onclick=()=>{activeGroup=g;renderGroups();render()};bar.appendChild(b)})}function createGroup(){const name=$('newGroup').value.trim();if(!name||name==='All'||name==='Ungrouped')return;if(!data.groups.includes(name))data.groups.push(name);$('newGroup').value='';save();renderGroups();render()}function renameVideo(id){const v=data.videos.find(x=>x.id===id);if(!v)return;const name=prompt('Rename video',v.title||'');if(name===null)return;const t=name.trim();if(t){v.title=t;save();render();if(current===id)$('nowTitle').textContent=t}}function moveVideo(id,g){const v=data.videos.find(x=>x.id===id);if(v){v.group=g;save();render()}}function thumb(id){return 'https://i.ytimg.com/vi/'+encodeURIComponent(id)+'/hqdefault.jpg'}function renderContinue(){const vids=[...data.videos].filter(v=>!v.done&&v.pos>0).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,8);$('continueCard').style.display=vids.length?'block':'none';const box=$('continueStrip');box.innerHTML='';vids.forEach(v=>{const d=document.createElement('div');d.className='continueItem';d.innerHTML='<img src="'+thumb(v.id)+'" alt=""><div class="title">'+esc(v.title||'YouTube video')+'</div><div class="status">'+status(v)+'</div>';d.onclick=()=>openVideo(v.id);box.appendChild(d)})}function render(){renderContinue();const l=$('list');const videos=[...data.videos].sort((a,b)=>(b.updated||0)-(a.updated||0)).filter(v=>activeGroup==='All'||v.group===activeGroup);$('count').textContent=videos.length+(videos.length===1?' video':' videos');if(!videos.length){l.innerHTML='<p class="small">'+(activeGroup==='All'?'None yet.':'No videos in this group.')+'</p>';return}l.innerHTML='';videos.forEach(v=>{const d=document.createElement('div');d.className='videoCard';const opts=allGroups().map(g=>'<option value="'+esc(g)+'" '+(g===v.group?'selected':'')+'>'+esc(g)+'</option>').join('');d.innerHTML='<div class="thumbWrap"><img class="thumb" src="'+thumb(v.id)+'" alt="" loading="lazy"><div class="progress"><span style="width:'+pct(v)+'%"></span></div></div><div class="videoInfo"><div class="title">'+esc(v.title||'Loading title…')+'</div><div class="status">'+status(v)+'</div><select class="groupSelect">'+opts+'</select><div class="actions"><button class="open">Open</button><button class="rename mutebtn">Rename</button><button class="remove mutebtn">Remove</button></div></div>';d.querySelector('.open').onclick=()=>openVideo(v.id);d.querySelector('.thumb').onclick=()=>openVideo(v.id);d.querySelector('.rename').onclick=()=>renameVideo(v.id);d.querySelector('.remove').onclick=()=>removeVideo(v.id);d.querySelector('.groupSelect').onchange=e=>moveVideo(v.id,e.target.value);l.appendChild(d)})}function addVideo(){const id=idFrom($('url').value);if(!id){alert('Please paste a valid YouTube link.');return}let v=data.videos.find(x=>x.id===id);const custom=$('title').value.trim(),group=$('addGroup').value||'Ungrouped';if(!v){v={id,title:custom,pos:0,duration:0,done:false,updated:Date.now(),group};data.videos.push(v)}else{if(custom)v.title=custom;v.group=group}save();renderGroups();render();openVideo(id);$('url').value='';$('title').value=''}function syncPlayerMeta(){if(!ready||!current||!player)return;const v=data.videos.find(x=>x.id===current);if(!v)return;const info=player.getVideoData?player.getVideoData():null,title=info&&info.title?info.title.trim():'';const dur=player.getDuration?player.getDuration():0;if(title&&(!v.title||v.title==='YouTube video'||v.title==='Loading title…'))v.title=title;if(Number.isFinite(dur)&&dur>0)v.duration=dur;save();$('nowTitle').textContent=v.title||title||'YouTube video'}function openVideo(id){savePos();current=id;const v=data.videos.find(x=>x.id===id);$('playerCard').style.display='block';$('nowTitle').textContent=v.title||'Loading title…';$('status').textContent=status(v);if(ready)player.loadVideoById({videoId:v.id,startSeconds:v.pos||0});$('playerCard').scrollIntoView({behavior:'smooth',block:'start'})}function savePos(){if(!ready||!current||!player)return;const v=data.videos.find(x=>x.id===current);if(!v)return;const t=player.getCurrentTime(),dur=player.getDuration?player.getDuration():0;if(Number.isFinite(t)){v.pos=t;v.updated=Date.now();if(Number.isFinite(dur)&&dur>0)v.duration=dur;if(v.duration&&v.pos>=v.duration-5)v.done=true;save();render();$('status').textContent=status(v)}}function markDone(){if(!current)return;savePos();const v=data.videos.find(x=>x.id===current);v.done=!v.done;save();render();$('status').textContent=status(v)}function removeVideo(id){if(!confirm('Remove this video from LectureShelf?'))return;if(current===id){current=null;$('playerCard').style.display='none';if(ready)player.stopVideo()}data.videos=data.videos.filter(x=>x.id!==id);save();render()}function exportLibrary(){savePos();const payload={app:'LectureShelf',version:2,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='LectureShelf-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('importFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),incoming=obj.data||obj;if(!incoming||!Array.isArray(incoming.videos))throw new Error();if(!confirm('Replace the current LectureShelf library with this backup?'))return;data={videos:incoming.videos,groups:Array.isArray(incoming.groups)?incoming.groups:[]};data.videos.forEach(v=>{if(typeof v.group!=='string')v.group='Ungrouped';if(!Number.isFinite(v.duration))v.duration=0});save();activeGroup='All';renderGroups();render();alert('Library imported.')}catch(err){alert('That does not look like a valid LectureShelf backup.')}finally{e.target.value=''}};window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{videoId:'',playerVars:{playsinline:1,rel:0},events:{onReady:()=>{ready=true;const last=[...data.videos].sort((a,b)=>(b.updated||0)-(a.updated||0))[0];if(last)openVideo(last.id)},onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING||e.data===YT.PlayerState.CUED)setTimeout(()=>{syncPlayerMeta();render()},400);if(e.data===YT.PlayerState.PAUSED||e.data===YT.PlayerState.ENDED)savePos()}}})};setInterval(()=>{savePos();syncPlayerMeta()},5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});window.addEventListener('pagehide',savePos);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});renderGroups();render();</script></body></html>
